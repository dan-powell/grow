all:
  hosts:
    test.ansibletest.autumnrain.co.uk:
      id: test # Must be unique across all sites
      ansible_host: ansibletest.autumnrain.co.uk
      ansible_port: 11986
      ansible_user: webmaster
      database:
        host: database
      redis:
        version: "7"
      php:
        version: "8.2"
      laravel:
        task: true
        horizon: true
      webroot: "public"
      # Change this to your domain without the www
      domain: "test.ansibletest.autumnrain.co.uk"
      # Add any additional domains here including www, comment out if no other domains required
      other_domains:
        - "*.test.ansibletest.autumnrain.co.uk"
      # Set to always to rebuild, or set to never to skip image rebuild
      rebuild: "always"