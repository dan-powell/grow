---
- name: Provision containers
  hosts: all
  vars:
      ansible_host: ansibletest.autumnrain.co.uk
      ansible_port: 11986
      ansible_user: webmaster
  roles:
    - role: autumnrain.docker.laravel
  tasks:
    - name: Run base site provision tasks
      ansible.builtin.include_role:
        name: autumnrain.docker.laravel
        tasks_from: base
      tags: nginx 
